custom_params:
  a_share_ratio: 0.95
  hk_ratio: 0.03
  long_ratio: 0.05
  max_stock_price: 50
  medium_ratio: 0.2
  short_ratio: 0.75
  us_ratio: 0.02
factor_weights:
  capital_flow: 0.15
  global_linkage: 0.05
  news_sentiment: 0.15
  policy_signal: 0.15
  risk_penalty: 0.1
  sector_momentum: 0.15
  technical_pattern: 0.15
  volume_confirmation: 0.1
initial_cash: 20000
paper_trading:
  cash_reserve_pct: 0.2
  daily_loss_limit_pct: 0.015
  entry_max_gap_below_pct: 0.01
  entry_trigger_tolerance_pct: 0.005
  enabled: false
  intraday_interval_minutes: 30
  max_stop_loss_pct: 0.05
  max_target_return_pct: 0.15
  max_drawdown_pause_pct: 0.1
  max_candidates_to_scan: 10
  max_daily_new_risk_pct: 0.015
  max_new_positions_per_day: 2
  max_position_pct: 0.3
  max_positions: 5
  max_total_exposure_pct: 0.8
  max_trade_risk_pct: 0.0075
  min_gross_reward_risk_ratio: 2.0
  min_net_reward_risk_ratio: 1.5
  min_order_amount: 1000
  min_stop_loss_pct: 0.02
  min_trade_confidence: 4
  mode: auto
  quote_max_age_seconds: 60
  reentry_cooldown_trading_days: 2
  same_sector_max_positions: 2
  veto_minutes: 0
  regime_limits:
    bearish:
      allow_etfs: true
      allow_stocks: false
      max_new_positions_per_day: 1
      max_position_pct: 0.15
      max_total_exposure_pct: 0.15
    bullish:
      allow_etfs: true
      allow_stocks: true
      max_new_positions_per_day: 2
      max_position_pct: 0.3
      max_total_exposure_pct: 0.8
    high_volatility:
      allow_etfs: true
      allow_stocks: true
      defensive_only: true
      max_new_positions_per_day: 1
      max_position_pct: 0.15
      max_total_exposure_pct: 0.4
      prefer_etfs: true
    neutral:
      allow_etfs: true
      allow_stocks: true
      max_new_positions_per_day: 2
      max_position_pct: 0.3
      max_total_exposure_pct: 0.8
    range:
      allow_etfs: true
      allow_stocks: true
      max_new_positions_per_day: 2
      max_position_pct: 0.25
      max_total_exposure_pct: 0.7
