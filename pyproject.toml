[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-intelligence"
version = "1.0.0"
description = "智能选股分析系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "click>=8.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "openai>=1.0",
    "akshare>=1.0",
    "tavily-python>=0.3",
    "tushare>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "packaging>=24"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = ["integration: 需要外部网络或真实数据源的集成测试"]

[project.scripts]
stock-intel = "cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
